<!DOCTYPE html>
<html>
<head>
  <title>My WebSite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-image: url("Flowers.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    a {
      font-size: 30px;
    }

    .heart {
      position: fixed;
      top: -20px;
      color: red;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh); }
    }
  </style>
</head>

<body>

  <h1>Youtube Video- 8K Flowers Video.</h1>

  <a href="https://www.youtube.com/live/6UP5LWOK_fg?si=1-RobWow_ICm7Q-1"
     target="_blank"><b>Beautiful Flowers &lt;-- tap on this</b></a>

  <br><br>


  <script>
    setInterval(function () {
      var h = document.createElement("div");
      h.className = "heart";
      h.innerHTML = "❤";
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = (10 + Math.random() * 15) + "px";
      h.style.animationDuration = (4 + Math.random() * 4) + "s";
      document.body.appendChild(h);
      setTimeout(function () { h.remove(); }, 8000);
    }, 400);
  </script>

</body>
</html>
